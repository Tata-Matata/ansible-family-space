vault_human_auth_mount_path: oidc
vault_human_oidc_role_name: human-admin
vault_human_oidc_discovery_url: ""
vault_human_oidc_client_id: ""
vault_human_oidc_client_secret: ""
vault_human_oidc_user_claim: email
vault_human_oidc_groups_claim: groups
vault_human_oidc_scopes:
  - openid
  - profile
  - email
vault_human_oidc_allowed_redirect_uris:
  - http://localhost:8250/oidc/callback
  - http://127.0.0.1:8250/oidc/callback
vault_human_oidc_required_groups: []
vault_human_policy_name: human-ssh
vault_human_policy_file: /var/lib/vault-state/human-ssh-policy.hcl
vault_human_policy_hcl: |
  path "{{ vault_ssh_secrets_mount_path }}/sign/{{ vault_human_ssh_role_name }}" {
    capabilities = ["update"]
  }
vault_human_ssh_role_name: human-admin
vault_human_ssh_allowed_users: ansible
vault_human_ssh_default_user: ansible
vault_human_ssh_ttl: 30m
vault_human_ssh_max_ttl: 1h
vault_human_token_ttl: 1h
vault_human_token_max_ttl: 4h
