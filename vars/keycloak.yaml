keycloak_scheme: http
keycloak_port: 8080
keycloak_base_url: "{{ keycloak_scheme }}://{{ oidc_service_name }}:{{ keycloak_port }}"
keycloak_realm_name: infra
keycloak_admin_group_name: infra-admins
keycloak_version: 26.1.0
keycloak_java_package: openjdk-21-jre-headless
keycloak_archive_url: "https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz"
keycloak_archive_path: "/tmp/keycloak-{{ keycloak_version }}.tar.gz"
keycloak_install_root: /opt/keycloak
keycloak_install_dir: "{{ keycloak_install_root }}/keycloak-{{ keycloak_version }}"
keycloak_home: "{{ keycloak_install_root }}/current"
keycloak_config_dir: /etc/keycloak
keycloak_env_file: "{{ keycloak_config_dir }}/keycloak.env"
keycloak_data_dir: /var/lib/keycloak
keycloak_log_dir: /var/log/keycloak
keycloak_user: keycloak
keycloak_group: keycloak
keycloak_db_host: 127.0.0.1
keycloak_db_port: 5432
keycloak_db_url: "jdbc:postgresql://{{ keycloak_db_host }}:{{ keycloak_db_port }}/{{ keycloak_postgres_db }}"
keycloak_admin_cli_server_url: "http://127.0.0.1:{{ keycloak_port }}"
keycloak_postgres_db: keycloak
keycloak_postgres_user: keycloak
keycloak_admin_user: admin
keycloak_healthcheck_url: "http://127.0.0.1:{{ keycloak_port }}/health/ready"
keycloak_vault_client_id: vault
keycloak_vault_redirect_uris:
  - http://localhost:8250/oidc/callback
  - http://127.0.0.1:8250/oidc/callback
keycloak_vault_web_origins:
  - "+"
keycloak_vault_groups_claim_name: groups
