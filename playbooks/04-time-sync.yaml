---
- name: Configure time synchronization with systemd-timesyncd
  hosts: all
  become: true
  gather_facts: false

  vars_files:
    - ../vars/ntp.yaml

  tasks:
    - name: Stop and disable chrony when present
      systemd:
        name: chrony
        enabled: false
        state: stopped
      failed_when: false

    - name: Configure systemd-timesyncd upstream servers
      blockinfile:
        path: "{{ timesyncd_config_path }}"
        marker: "# {mark} ANSIBLE MANAGED NTP"
        block: |
          [Time]
          NTP={{ ntp_servers | join(' ') }}
          FallbackNTP=
      register: timesyncd_config

    - name: Enable and restart systemd-timesyncd
      systemd:
        name: "{{ timesyncd_service_name }}"
        enabled: true
        state: "{{ 'restarted' if timesyncd_config.changed else 'started' }}"

    - name: Enable NTP synchronization via timedatectl
      command: timedatectl set-ntp true
      changed_when: false

    - name: Show timedatectl status
      command: timedatectl status
      register: timedatectl_status
      changed_when: false

    - name: Show timesyncd status when available
      command: timedatectl timesync-status
      register: timesyncd_status
      changed_when: false
      failed_when: false

    - name: Display time synchronization summary
      debug:
        msg:
          - "timedatectl status: {{ timedatectl_status.stdout_lines | default([]) }}"
          - "timesyncd status: {{ timesyncd_status.stdout_lines | default([]) }}"