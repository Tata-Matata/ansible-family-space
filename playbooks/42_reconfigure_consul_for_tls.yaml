###############################################################################
# Copy certificates from Bastion 
# Enable TLS verification in Consul and restartart the service
#
# Preconditions:
#   - Consul is installed and running
#   - Bootstrap CA certificate has been distributed:
#       * {{ consul_tls_dir }}/ca.pem
#   - Consul server certificate and key have been distributed:
#       * {{ consul_tls_dir }}/server.pem
#       * {{ consul_tls_dir }}/server-key.pem

###############################################################################
## on CONSUL #############################################################
###############################################################################

- name: Copy Consul TLS material from Bastion to Consul
  hosts: consul
  gather_facts: true
  become: true
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
  tasks:
    - name: Copy Consul TLS material from Bastion to Consul
      import_tasks: ../tasks/bootstrap-tls-vault-consul/31_distribute_tls_consul.yaml
      
- name: Reconfigure and restart Consul to use TLS
  hosts: consul
  become: true
  gather_facts: false
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
  tasks:
  - name: Stop Consul
    systemd:
      name: consul
      state: stopped

  # the fact affects the configuration template and is used to conditionally render TLS settings
  # must be set before re-rendering the configuration
  - name: Enable Consul TLS mode
    set_fact:
      consul_tls_enabled: true

  - name: Re-render Consul configuration with TLS verification enabled
    import_role:
      name: consul
      tasks_from: configure

  - name: Start Consul
    systemd:
      name: consul
      state: started

  - name: Verify Consul service is running
    command: systemctl is-active consul
    register: consul_status
    changed_when: false
    failed_when: consul_status.stdout != 'active'

  - name: Show Consul service status and logs if failed
    block:
    - name: Get Consul service status
      command: systemctl status consul --no-pager
      register: consul_full_status
      changed_when: false

    - name: Get recent Consul logs
      command: journalctl -u consul -n 50 --no-pager
      register: consul_logs
      changed_when: false

    - name: Display Consul status and logs
      debug:
        msg:
          - "Consul Status:"
          - "{{ consul_full_status.stdout_lines }}"
          - ""
          - "Recent Consul Logs:"
          - "{{ consul_logs.stdout_lines }}"
      when: consul_status.stdout != 'active'

    - name: Healthcheck Consul API with TLS from localhost
      import_role:
        name: consul
        tasks_from: healthcheck

#################################################################################
# on BASTION: Verify TLS connectivity to Consul  ################################
#################################################################################

- name: Verify Consul HTTPS API from Bastion
  hosts: bastion_primary
  become: false
  gather_facts: false
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
  tasks:
  - name: Enable Consul TLS mode for URL construction
    set_fact:
      consul_tls_enabled: true
      
  - name: Verify Consul HTTPS API from Bastion
    include_role:
      name: verify_https
    vars:
      verify_https_name: "Consul api"
      verify_https_url: "{{ consul_api_leader_addr}}"
      # mTLS client certs for Bastion → Consul
      verify_https_client_cert: "{{ bastion_client_auth_to_consul_cert_path }}"
      verify_https_client_key: "{{ bastion_client_auth_to_consul_key_path }}"
      # for Ansible to verify Consul server certs signed by our CA
      verify_https_ca_cert: "{{ bastion_ca_cert_path }}"

