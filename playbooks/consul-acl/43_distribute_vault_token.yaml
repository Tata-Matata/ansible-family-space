- name: Retrieve Vault Consul backend token from bastion
  hosts: bastion_primary
  gather_facts: false
  become: true
  vars_files:
  - ../../vars/bootstrap-tls-vault-consul.yaml
  - ../../vars/consul-acl-vars.yaml
  tasks:
  - name: Read Vault Consul backend token
    slurp:
      src: "{{ vault_consul_token_tmp_path_bastion }}"
    register: vault_consul_token_file
    no_log: true

  - name: Set Vault Consul backend token fact
    set_fact:
      vault_consul_token: "{{ vault_consul_token_file.content | b64decode | trim }}"
    changed_when: false
    no_log: true

- name: Distribute Vault Consul backend token to Vault servers
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
  - ../../vars/bootstrap-tls-vault-consul.yaml
  - ../../vars/consul-acl-vars.yaml
  vars:
    vault_consul_token: "{{ hostvars[groups['bastion_primary'][0]].vault_consul_token }}"
  tasks:
  - name: Install Vault Consul token file
    copy:
      dest: "{{ vault_consul_token_path }}"
      owner: vault
      group: vault
      mode: "0600"
      content: "{{ vault_consul_token }}"
    no_log: true

  - name: Ensure Vault systemd override directory exists
    file:
      path: "{{ vault_consul_systemd_override_path | dirname }}"
      state: directory
      owner: root
      group: root
      mode: "0755"

  - name: Install Vault Consul token systemd override
    copy:
      dest: "{{ vault_consul_systemd_override_path }}"
      owner: root
      group: root
      mode: "0600"
      content: |
        [Service]
        Environment=CONSUL_HTTP_TOKEN={{ vault_consul_token }}
    no_log: true

  - name: Render Vault config via vault role
    import_role:
      name: vault
      tasks_from: configure

  - name: Reload systemd
    systemd:
      daemon_reload: true

  - name: Restart Vault
    service:
      name: vault
      state: restarted

  - name: Verify Vault service is running
    command: systemctl is-active vault
    register: vault_service_status
    changed_when: false
    failed_when: vault_service_status.stdout != 'active'

  - name: Verify Vault HTTPS API is reachable after restart
    include_role:
      name: verify_https
    vars:
      verify_https_name: "Vault api after token distribution"
      verify_https_url: "{{ vault_api_health_addr }}"
      verify_https_client_cert: "{{ vault_server_cert_path }}"
      verify_https_client_key: "{{ vault_server_key_path }}"
      verify_https_ca_cert: "{{ vault_ca_cert_path }}"
      verify_https_expected_status: [200, 429, 501]
