- name: Verify Vault Consul ACL usage
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
  - ../../vars/bootstrap-tls-vault-consul.yaml
  - vars/consul-acl-vars.yaml
  tasks:
  - set_fact:
      vault_tls_enabled: true
      consul_tls_enabled: true
  - name: Read Vault Consul token from HCL
    include_tasks: tasks/read_hcl_value.yaml
    vars:
      hcl_file_path: "{{ vault_consul_token_path }}"
      hcl_key_path: "storage.consul.token"
      hcl_output_var: "vault_consul_token"

  - name: Fail when Vault Consul token cannot be parsed
    fail:
      msg: >-
        Could not parse token from {{ vault_consul_token_path }}.
        Expected: token = "<secret>"
    when: (vault_consul_token | default('') | trim) == ''

  - name: Vault token can write to vault/ prefix
    uri:
      url: "{{ consul_api_key_value_addr }}/{{ vault_prefix_in_consul_store }}acl-test"
      method: PUT
      headers:
        X-Consul-Token: "{{ vault_consul_token }}"
      body: "ok"
      status_code: 200
      validate_certs: true
      ca_path: "{{ vault_ca_cert_path }}"
      client_cert: "{{ vault_client_auth_to_consul_cert_path }}"
      client_key: "{{ vault_client_auth_to_consul_key_path }}"
    changed_when: false

  - name: Vault token cannot write outside vault/ prefix
    uri:
      url: "{{ consul_api_key_value_addr }}/not-vault/acl-test"
      method: PUT
      headers:
        X-Consul-Token: "{{ vault_consul_token }}"
      body: "deny"
      status_code: [ 401, 403 ]
      validate_certs: true
      ca_path: "{{ vault_ca_cert_path }}"
      client_cert: "{{ vault_client_auth_to_consul_cert_path }}"
      client_key: "{{ vault_client_auth_to_consul_key_path }}"
    changed_when: false

  - name: HTTP API is not reachable from Vault
    uri:
      url: "http://{{ consul_service_name }}:{{ consul_http_port }}{{ consul_api_leader_path }}"
      method: GET
      status_code: 0
    register: http_test
    failed_when: http_test is succeeded
    changed_when: false
