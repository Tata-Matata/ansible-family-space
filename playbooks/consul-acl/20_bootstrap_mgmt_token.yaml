# Runs on Bastion, targets Consul API over HTTPS + mTLS
# This task is not idempotent, so it should fail if run more than once. If ACLs are already bootstrapped
# Generate the management token, capture it once, never print it
# Never re-run this step accidentally

# returns JSON that we do not print, do not log, do not write to disk
# only accessible in consul_acl_bootstrap.stdout
#{
#  "AccessorID": "...",
#  "SecretID": "s.xxxxx",
#  "Description": "Bootstrap Token"
#}

# With the token we regain controlled access to the Consul API
# we can create policies and tokens
- hosts: bastion_primary
  become: true
  gather_facts: false
  vars_files:
  - ../../vars/bootstrap-tls-vault-consul.yaml
  - ../../vars/consul-acl-vars.yaml
  tasks:
  - name: Ensure Bastion Consul client certificate exists
    stat:
      path: "{{ bastion_client_auth_to_consul_cert_path }}"
    register: bastion_consul_client_cert

  - name: Ensure Bastion Consul client key exists
    stat:
      path: "{{ bastion_client_auth_to_consul_key_path }}"
    register: bastion_consul_client_key

  - name: Fail if Bastion Consul client certificate is missing
    fail:
      msg: >
        Missing Bastion Consul client certificate at {{ bastion_client_auth_to_consul_cert_path }}.
        Re-run TLS distribution before ACL bootstrap.
    when: not bastion_consul_client_cert.stat.exists

  - name: Fail if Bastion Consul client key is missing
    fail:
      msg: >
        Missing Bastion Consul client key at {{ bastion_client_auth_to_consul_key_path }}.
        Re-run TLS distribution before ACL bootstrap.
    when: not bastion_consul_client_key.stat.exists
      
  - name: Bootstrap Consul ACL system
    uri:
      url: "{{ consul_api_addr }}/v1/acl/bootstrap"
      method: PUT
      body_format: json
      body: {}
      status_code: [200, 400, 401, 403, 409, 500]
      validate_certs: true
      client_cert: "{{ bastion_client_auth_to_consul_cert_path }}"
      client_key: "{{ bastion_client_auth_to_consul_key_path }}"
    register: consul_acl_bootstrap
    no_log: true
    changed_when: false
    failed_when: false

  - name: Build bootstrap failure context
    set_fact:
      consul_acl_bootstrap_error_text: >-
        {{
          (consul_acl_bootstrap.msg | default('')) ~ ' ' ~
          (consul_acl_bootstrap.content | default('')) ~ ' ' ~
          ((consul_acl_bootstrap.json | default({})) | to_json)
        }}
    changed_when: false
    when: (consul_acl_bootstrap.status | default(0)) != 200

  - name: Extract ACL bootstrap reset index from error text
    set_fact:
      consul_acl_bootstrap_reset_index: >-
        {{ (consul_acl_bootstrap_error_text | regex_findall('(?i)reset[ -]*index[^0-9]*([0-9]+)') | first) | default('') }}
    changed_when: false
    when: (consul_acl_bootstrap.status | default(0)) != 200
  
  # Since logging is disabled, we want to give a hint in case if failure due to accidental re-run
  - name: Fail with helper message when ACL bootstrap was already done
    fail:
      msg: >
        Consul ACL bootstrap appears to have already been run. This playbook is one-time-only.
        Reuse the existing management token.
        If it is lost and reset index is available, perform Consul ACL reset on the current leader by writing
        '{{ consul_acl_bootstrap_reset_index | default('unknown') }}' to
        '{{ consul_data_dir }}/acl-bootstrap-reset', then retry bootstrap.
        If reset index is still empty, run bootstrap directly on the Consul leader to obtain the index from the raw error.
    when:
    - (consul_acl_bootstrap.status | default(0)) != 200
    - consul_acl_bootstrap_error_text is search('ACL bootstrap no longer allowed|bootstrap no longer allowed|already bootstrapped')

  - name: Fail with explicit TLS/connection hint
    fail:
      msg: >
        Consul ACL bootstrap failed due to TLS or connectivity issue from Bastion to Consul API.
        Check DNS for {{ consul_service_name }}, client cert/key validity, and server certificate SAN.
    when:
    - (consul_acl_bootstrap.status | default(0)) != 200
    - consul_acl_bootstrap_error_text is search('x509|certificate|unknown authority|tls|handshake|connection refused|dial tcp|no such host')

  - name: Fail with explicit ACL permission hint
    fail:
      msg: >
        Consul ACL bootstrap request was denied by Consul ACLs.
        Most likely ACL bootstrap has already been consumed, or another ACL token is required for this endpoint in current state.
    when:
    - (consul_acl_bootstrap.status | default(0)) != 200
    - consul_acl_bootstrap_error_text is search('Permission denied|ACL not found|403')

  - name: Fail on unexpected Consul ACL bootstrap errors
    fail:
      msg: >
        Consul ACL bootstrap failed for an unexpected reason.
        status={{ consul_acl_bootstrap.status | default('n/a') }}
        detail={{ consul_acl_bootstrap.msg | default(consul_acl_bootstrap.content | default('no details returned')) }}
    when:
    - (consul_acl_bootstrap.status | default(0)) != 200
    - not (consul_acl_bootstrap_error_text is search('ACL bootstrap no longer allowed|bootstrap no longer allowed|already bootstrapped'))
    - not (consul_acl_bootstrap_error_text is search('x509|certificate|unknown authority|tls|handshake|connection refused|dial tcp|no such host'))
    - not (consul_acl_bootstrap_error_text is search('Permission denied|ACL not found|403'))
  
  # we will store here temporarily the management token and consul-vault token in the next playbook, we will remove it at the end of the run
  - name: Ensure Consul ACL token directory exists
    file:
      path: "{{ consul_tokens_tmp_dir }}"
      state: directory
      owner: root
      group: root
      mode: "0700"
  - name: Store Consul management token on bastion
    copy:
      content: "{{ consul_acl_bootstrap.json.SecretID }}"
      dest: "{{ consul_tmp_management_token_path }}"
      owner: root
      group: root
      mode: "0600"