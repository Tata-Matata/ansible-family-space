---
- name: Generate and sign admin SSH certificate on bastion
  hosts: bastion_primary
  become: true
  gather_facts: false

  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
    - ../vars/vault-config-ssh.yaml

  tasks:
    - name: Ensure admin SSH signing token exists on bastion
      stat:
        path: "{{ vault_ssh_admin_token_path_bastion }}"
      register: vault_ssh_admin_token_file_stat

    - name: Fail if admin SSH signing token is missing on bastion
      fail:
        msg: "Vault SSH admin signing token is missing at {{ vault_ssh_admin_token_path_bastion }}. Run playbook 72-admin-role-policy-token.yaml first."
      when: not vault_ssh_admin_token_file_stat.stat.exists

    - name: Read admin SSH signing token from bastion
      slurp:
        path: "{{ vault_ssh_admin_token_path_bastion }}"
      register: vault_ssh_admin_token_file_raw
      no_log: true

    - name: Parse admin SSH signing token
      set_fact:
        vault_ssh_admin_token: "{{ vault_ssh_admin_token_file_raw.content | b64decode | trim }}"
      no_log: true

    - name: Ensure ansible SSH directory exists
      file:
        path: "{{ vault_ssh_admin_test_private_key_path | dirname }}"
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Generate admin SSH test key pair on bastion if missing
      command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -f
          - "{{ vault_ssh_admin_test_private_key_path }}"
          - -N
          - ""
          - -C
          - "ansible-admin-vault-test"
      args:
        creates: "{{ vault_ssh_admin_test_private_key_path }}"
      become_user: ansible

    - name: Read admin SSH public key from bastion
      slurp:
        path: "{{ vault_ssh_admin_test_public_key_path }}"
      register: vault_ssh_admin_public_key_raw

    - name: Sign admin SSH public key with Vault API
      uri:
        url: "{{ vault_api_addr }}/v1/{{ vault_ssh_secrets_mount_path }}/sign/{{ vault_ssh_admin_role_name }}"
        method: POST
        body_format: json
        body:
          public_key: "{{ vault_ssh_admin_public_key_raw.content | b64decode | trim }}"
        headers:
          X-Vault-Token: "{{ vault_ssh_admin_token }}"
        client_cert: "{{ bastion_client_auth_to_vault_cert_path }}"
        client_key: "{{ bastion_client_auth_to_vault_key_path }}"
        ca_path: "{{ bastion_ca_cert_path }}"
        return_content: true
        status_code: 200
      register: vault_ssh_admin_sign_response
      changed_when: true
      no_log: true

    - name: Extract signed admin SSH certificate
      set_fact:
        vault_ssh_admin_signed_key: "{{ vault_ssh_admin_sign_response.json.data.signed_key }}"
      no_log: true

    - name: Write signed admin SSH certificate on bastion
      copy:
        dest: "{{ vault_ssh_admin_test_signed_key_path }}"
        owner: ansible
        group: ansible
        mode: "0644"
        content: "{{ vault_ssh_admin_signed_key }}\n"
      no_log: true

    - name: Verify signed admin SSH certificate metadata
      command:
        argv:
          - ssh-keygen
          - -Lf
          - "{{ vault_ssh_admin_test_signed_key_path }}"
      register: vault_ssh_admin_signed_key_info
      changed_when: false
      become_user: ansible

    - name: Show signed admin SSH certificate summary
      debug:
        msg: "Generated SSH certificate at {{ vault_ssh_admin_test_signed_key_path }} for role {{ vault_ssh_admin_role_name }}."
