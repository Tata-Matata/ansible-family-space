###############################################################################
# Copy certificates from Bastion 
# Enable TLS verification in Consul and restartart the service
#
# Preconditions:
#   - Consul is installed and running
#   - Bootstrap CA certificate has been distributed:
#       * {{ consul_tls_dir }}/ca.pem
#   - Consul server certificate and key have been distributed:
#       * {{ consul_tls_dir }}/server.pem
#       * {{ consul_tls_dir }}/server-key.pem

###############################################################################
## on CONSUL #############################################################
###############################################################################

- name: Copy Consul TLS material from Bastion to Consul
  hosts: consul
  gather_facts: true
  become: true
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
  tasks:
    - name: Copy Consul TLS material from Bastion to Consul
      import_tasks: ../tasks/bootstrap-tls-vault-consul/31_distribute_tls_consul.yaml
      
- name: Reconfigure and restart Consul to use TLS
  hosts: consul
  become: true
  gather_facts: false
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
    - ../vars/consul-acl-vars.yaml
  tasks:
  - name: Stop Consul
    systemd:
      name: consul
      state: stopped

  - name: Re-render Consul configuration with TLS verification enabled
    import_role:
      name: consul
      tasks_from: configure

  - name: Start Consul
    systemd:
      name: consul
      state: started

  - name: Verify Consul service is running
    command: systemctl is-active consul
    register: consul_status
    changed_when: false
    failed_when: consul_status.stdout != 'active'

  - name: Show Consul service status and logs if failed
    block:
    - name: Get Consul service status
      command: systemctl status consul --no-pager
      register: consul_full_status
      changed_when: false

    - name: Get recent Consul logs
      command: journalctl -u consul -n 50 --no-pager
      register: consul_logs
      changed_when: false

    - name: Display Consul status and logs
      debug:
        msg:
          - "Consul Status:"
          - "{{ consul_full_status.stdout_lines }}"
          - ""
          - "Recent Consul Logs:"
          - "{{ consul_logs.stdout_lines }}"
      when: consul_status.stdout != 'active'

    - name: Healthcheck Consul API with TLS from localhost
      import_role:
        name: consul
        tasks_from: healthcheck

#################################################################################
# on BASTION: Verify TLS connectivity to Consul  ################################
#################################################################################

- name: Verify Consul HTTPS API from Bastion
  hosts: bastion_primary
  become: false
  gather_facts: false
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
    - ../vars/consul-acl-vars.yaml
  tasks:
    - name: Probe Consul HTTPS API from Bastion without ACL token
      uri:
        url: "{{ consul_api_health_addr }}"
        method: GET
        return_content: true
        status_code: [200, 401, 403]
        validate_certs: true
        client_cert: "{{ bastion_client_auth_to_consul_cert_path }}"
        client_key: "{{ bastion_client_auth_to_consul_key_path }}"
      register: bastion_consul_api_probe
      changed_when: false

    # if the probe returns 401 or 403, ACL is already enabled in Consult and 
    # an ACL token is required for Bastion verification
    - name: Decide whether Bastion verification should use a Consul ACL token
      set_fact:
        bastion_consul_verify_use_acl_token: "{{ bastion_consul_api_probe.status in [401, 403] }}"
      changed_when: false

    - name: Check if bastion agent-read token file exists
      stat:
        path: "{{ bastion_consul_read_token_path }}"
      register: bastion_agent_read_token_file_stat
      changed_when: false

    - name: Fail when Bastion verification requires token but token file is missing
      fail:
        msg: >-
          Consul runtime is denying unauthenticated access to {{ consul_api_self_path }}
          from Bastion with status {{ bastion_consul_api_probe.status }}, so the Bastion
          read token is required for verification, but the token file
          {{ bastion_consul_read_token_path }} is missing.
      when:
        - bastion_consul_verify_use_acl_token | bool
        - not bastion_agent_read_token_file_stat.stat.exists

    - name: Read bastion agent-read token from file
      slurp:
        src: "{{ bastion_consul_read_token_path }}"
      register: bastion_agent_read_token_file
      no_log: true
      when:
        - bastion_consul_verify_use_acl_token | bool
        - bastion_agent_read_token_file_stat.stat.exists

    - name: Set bastion agent-read token fact
      set_fact:
        bastion_agent_read_token: "{{ bastion_agent_read_token_file.content | b64decode | trim }}"
      changed_when: false
      no_log: true
      when:
        - bastion_consul_verify_use_acl_token | bool
        - bastion_agent_read_token_file_stat.stat.exists

    - name: Verify Consul HTTPS API from Bastion
      include_role:
        name: verify_https
      vars:
        verify_https_name: "Consul api"
        verify_https_url: "{{ consul_api_leader_addr }}"
        # mTLS client certs for Bastion → Consul
        verify_https_client_cert: "{{ bastion_client_auth_to_consul_cert_path }}"
        verify_https_client_key: "{{ bastion_client_auth_to_consul_key_path }}"
        # CA is now installed in system trust store, no need to specify
        verify_https_headers: "{{ {'X-Consul-Token': bastion_agent_read_token} if bastion_consul_verify_use_acl_token | bool else omit }}"

