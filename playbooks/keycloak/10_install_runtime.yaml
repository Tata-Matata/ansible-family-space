---
# Install only the container runtime and local directories.
# PostgreSQL and Keycloak themselves are deployed by 20_deploy_stack.yaml.
- name: Install container runtime for Keycloak
  hosts: oidc
  become: true
  gather_facts: false

  vars_files:
    - ../../vars/keycloak.yaml
    - ../../vars/keycloak-secrets.yaml

  tasks:
    - name: Install Docker engine
      apt:
        name:
          - docker.io
        state: present
        update_cache: true

    - name: Install Docker Compose v2 package when available
      apt:
        name: docker-compose-v2
        state: present
      register: keycloak_compose_v2_install
      failed_when: false

    - name: Install legacy Docker Compose package when v2 package is unavailable
      apt:
        name: docker-compose
        state: present
      when: keycloak_compose_v2_install is failed

    - name: Ensure Docker service is enabled and started
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Ensure Keycloak project directory exists
      file:
        path: "{{ keycloak_project_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure PostgreSQL data directory exists with container ownership
      file:
        path: "{{ keycloak_postgres_data_dir }}"
        state: directory
        owner: "{{ keycloak_postgres_data_dir_owner }}"
        group: "{{ keycloak_postgres_data_dir_group }}"
        mode: "{{ keycloak_postgres_data_dir_mode }}"
        recurse: true

    - name: Ensure Keycloak data directory exists with container ownership
      file:
        path: "{{ keycloak_data_dir }}"
        state: directory
        owner: "{{ keycloak_data_dir_owner }}"
        group: "{{ keycloak_data_dir_group }}"
        mode: "{{ keycloak_data_dir_mode }}"
        recurse: true
