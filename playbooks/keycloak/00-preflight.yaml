---
# Validate inventory and required variables before installing the Keycloak services.
# This playbook does not assume Keycloak or PostgreSQL are already installed.
- name: Keycloak preflight checks
  hosts: oidc
  become: true
  gather_facts: false

  vars_files:
    - ../../vars/vault-human-auth-with-keycloak.yaml
    - ../../vars/vault-keycloak-secrets.yaml

  tasks:
    - name: Ensure OIDC inventory group is populated
      assert:
        that:
          - groups['oidc'] is defined
          - groups['oidc'] | length > 0
        fail_msg: Add at least one host to the oidc group in inventory before running 80-keycloak.yaml.

    - name: Validate secrets needed for Keycloak installation and bootstrap are set
      assert:
        that:
          - keycloak_postgres_password | length > 0
          - keycloak_admin_password | length > 0
          - keycloak_vault_client_secret | length > 0
        fail_msg: Fill keycloak_postgres_password, keycloak_admin_password, and keycloak_vault_client_secret in vars/vault-keycloak-secrets.yaml and encrypt it with Ansible Vault before running 80-keycloak.yaml.

    - name: Validate Keycloak service settings
      assert:
        that:
          - oidc_service_name | length > 0
          - keycloak_port | int > 0
          - keycloak_http_port | int > 0
          - keycloak_management_port | int > 0
          - keycloak_version | length > 0
          - keycloak_archive_url | length > 0
          - keycloak_java_package | length > 0
          - keycloak_realm_name | length > 0
          - keycloak_vault_client_id | length > 0
        fail_msg: Review vars/vault-human-auth-with-keycloak.yaml and provide the required Keycloak service, Java, and realm settings.
