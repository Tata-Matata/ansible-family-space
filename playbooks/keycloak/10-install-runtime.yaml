---
# Install the OS packages, service user, and local directories needed by Keycloak.
# Keycloak binaries and service configuration are deployed by 20_deploy_stack.yaml.
- name: Install Keycloak runtime dependencies
  hosts: oidc
  become: true
  gather_facts: false

  vars_files:
    - ../../vars/keycloak.yaml

  tasks:
    - name: Install ACL package
      apt:
        name: acl
        state: present
        update_cache: true

    - name: Install PostgreSQL package
      apt:
        name: postgresql
        state: present

    - name: Install Keycloak Java runtime package
      apt:
        name: "{{ keycloak_java_package }}"
        state: present

    - name: Create Keycloak group
      group:
        name: "{{ keycloak_group }}"
        system: true

    - name: Create Keycloak user
      user:
        name: "{{ keycloak_user }}"
        group: "{{ keycloak_group }}"
        system: true
        home: "{{ keycloak_data_dir }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Ensure Keycloak directories exist
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ keycloak_install_root }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ keycloak_config_dir }}"
          owner: root
          group: "{{ keycloak_group }}"
          mode: "0750"
        - path: "{{ keycloak_data_dir }}"
          owner: "{{ keycloak_user }}"
          group: "{{ keycloak_group }}"
          mode: "0750"
        - path: "{{ keycloak_log_dir }}"
          owner: "{{ keycloak_user }}"
          group: "{{ keycloak_group }}"
          mode: "0750"
