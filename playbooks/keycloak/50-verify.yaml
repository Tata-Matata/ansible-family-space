---
- name: Verify Keycloak deployment and Vault client configuration
  hosts: oidc
  become: true
  gather_facts: false

  vars_files:
    - ../../vars/keycloak.yaml
    - ../../vars/keycloak-secrets.yaml

  tasks:
    - name: Verify Keycloak readiness endpoint
      uri:
        url: "{{ keycloak_healthcheck_url }}"
        method: GET
        status_code: 200
        ca_path: "{{ keycloak_ca_cert_path if keycloak_tls_enabled else omit }}"
        validate_certs: "{{ keycloak_tls_enabled }}"

    - name: Verify Keycloak OIDC discovery endpoint
      uri:
        url: "{{ keycloak_base_url }}/realms/{{ keycloak_realm_name }}/.well-known/openid-configuration"
        method: GET
        status_code: 200
        ca_path: "{{ keycloak_ca_cert_path if keycloak_tls_enabled else omit }}"
        validate_certs: "{{ keycloak_tls_enabled }}"
      register: keycloak_discovery

    - name: Authenticate Keycloak admin CLI
      become_user: "{{ keycloak_user }}"
      environment: "{{ keycloak_admin_cli_environment }}"
      command:
        argv:
          - "{{ keycloak_home }}/bin/kcadm.sh"
          - config
          - credentials
          - --server
          - "{{ keycloak_admin_cli_server_url }}"
          - --realm
          - master
          - --user
          - "{{ keycloak_admin_user }}"
          - --password
          - "{{ keycloak_admin_password }}"
      changed_when: false
      no_log: true

    - name: Read Keycloak realm
      become_user: "{{ keycloak_user }}"
      environment: "{{ keycloak_admin_cli_environment }}"
      command:
        argv:
          - "{{ keycloak_home }}/bin/kcadm.sh"
          - get
          - realms/{{ keycloak_realm_name }}
      register: keycloak_realm_read
      changed_when: false
      no_log: true

    - name: Read Keycloak Vault client
      become_user: "{{ keycloak_user }}"
      environment: "{{ keycloak_admin_cli_environment }}"
      command:
        argv:
          - "{{ keycloak_home }}/bin/kcadm.sh"
          - get
          - clients
          - -r
          - "{{ keycloak_realm_name }}"
          - -q
          - clientId={{ keycloak_vault_client_id }}
      register: keycloak_vault_client_read
      changed_when: false
      no_log: true

    - name: Show Keycloak follow-up values for Vault OIDC config
      debug:
        msg:
          - "Keycloak discovery URL: {{ keycloak_base_url }}/realms/{{ keycloak_realm_name }}"
          - "Keycloak discovery issuer: {{ (keycloak_discovery.json.issuer | default('unavailable')) }}"
          - "Vault OIDC client id: {{ keycloak_vault_client_id }}"
          - "Redirect URIs configured in Keycloak: {{ keycloak_vault_redirect_uris | join(', ') }}"
