###############################################################################
# Copy TLS material from Bastion to Vault and re-configure Vault for TLS
# Preconditions:
#   - Vault is installed, uninitialized, sealed
#   - Vault is currently reachable over HTTP
#   - TLS material has already been distributed:
#       vault_server_cert_path: "{{ vault_tls_dir }}/{{vault_server_cert_file}}"
#       vault_server_key_path: "{{ vault_tls_dir }}/{{vault_server_key_file}}"
#       vault_ca_cert_path: "{{ vault_tls_dir }}/{{ca_cert_file}}"
#
###############################################################################


## DISTRIBUTE TLS MATERIAL TO VAULT from BASTION
- name: Copy Vault TLS material from Bastion to Vault
  hosts: vault
  gather_facts: true
  become: true
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
  tasks:
    - name: Copy Vault TLS material from Bastion to Vault
      import_tasks: ../tasks/bootstrap-tls-vault-consul/30_distribute_tls_vault.yaml

## RE-CONFIGURE VAULT FOR TLS and RESTART
- name: Reconfigure and restart Vault to use TLS
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
    - ../vars/consul-acl-vars.yaml

  tasks:
  - name: Stop Vault
    systemd:
      name: vault
      state: stopped

     
  - name: Render Vault config
    import_role:
      name: vault
      tasks_from: configure

  - name: Probe Consul HTTPS API from Vault without ACL token
    uri:
      url: "{{ consul_api_health_addr }}"
      method: GET
      return_content: true
      status_code: [200, 401, 403]
      validate_certs: true
      ca_path: "{{ vault_ca_cert_path }}"
      client_cert: "{{ vault_client_auth_to_consul_cert_path }}"
      client_key: "{{ vault_client_auth_to_consul_key_path }}"
    register: vault_consul_api_probe
    changed_when: false

  - name: Check if Vault Consul token file exists
    stat:
      path: "{{ vault_consul_token_path }}"
    register: vault_consul_token_file_stat
    changed_when: false
    when: vault_consul_api_probe.status in [401, 403]

  - name: Check if Vault Consul systemd override exists
    stat:
      path: "{{ vault_consul_systemd_override_path }}"
    register: vault_consul_systemd_override_stat
    changed_when: false
    when: vault_consul_api_probe.status in [401, 403]

  - name: Fail when Vault Consul token is required but token file is missing
    fail:
      msg: >-
        Consul runtime is denying unauthenticated access from Vault with status
        {{ vault_consul_api_probe.status }}, so the Vault Consul backend token is
        required, but the token file {{ vault_consul_token_path }} is missing.
        Re-run playbooks/consul-acl/43_distribute_vault_token.yaml.
    when:
      - vault_consul_api_probe.status in [401, 403]
      - not vault_consul_token_file_stat.stat.exists

  - name: Fail when Vault Consul token is required but systemd override is missing
    fail:
      msg: >-
        Consul runtime is denying unauthenticated access from Vault with status
        {{ vault_consul_api_probe.status }}, so Vault must provide CONSUL_HTTP_TOKEN,
        but the systemd override file {{ vault_consul_systemd_override_path }} is missing.
        Re-run playbooks/consul-acl/43_distribute_vault_token.yaml.
    when:
      - vault_consul_api_probe.status in [401, 403]
      - not vault_consul_systemd_override_stat.stat.exists

  - name: Reload systemd before starting Vault
    systemd:
      daemon_reload: true
      

  - name: Start Vault
    systemd:
      name: vault
      state: started

  - name: Verify Vault service is running
    command: systemctl is-active vault
    register: vault_status
    changed_when: false
    failed_when: vault_status.stdout != 'active'

  - name: Show Vault service status and logs if failed
    block:
    - name: Get Vault service status
      command: systemctl status vault --no-pager
      register: vault_full_status
      changed_when: false

    - name: Get recent Vault logs
      command: journalctl -u vault -n 50 --no-pager
      register: vault_logs
      changed_when: false

    - name: Display Vault status and logs
      debug:
        msg:
          - "Vault Status:"
          - "{{ vault_full_status.stdout_lines }}"
          - ""
          - "Recent Vault Logs:"
          - "{{ vault_logs.stdout_lines }}"
    when: vault_status.stdout != 'active'

  - name: Verify Vault HTTPS is active (final state)
    uri:
      url: "{{ vault_api_health_internal_addr}}"
      method: GET
      status_code: [ 429, 501, 503 ]
      # for Ansible to validate the Vault server certificate
      ca_path: "{{ vault_ca_cert_path }}"
      # since we enabled mTLS, Vault will want to check client certs
      # Vault server cert is also a valid client cert for mTLS here
      client_cert: "{{ vault_server_cert_path }}"
      client_key: "{{ vault_server_key_path }}"
      validate_certs: true
      return_content: false
    register: vault_https_internal_health
    changed_when: false

  - name: Fail when Vault restarted sealed after TLS reconfigure
    fail:
      msg: >-
        Vault HTTPS is reachable, but Vault is sealed after restart (health status 503).
        Run playbooks/62-vault-unseal-preflight-check.yaml and then
        playbooks/63-vault-unseal.yaml.
    when: vault_https_internal_health.status == 503

  ###############################################################################
  # on BASTION: Verify TLS connectivity to Vault  ############################### 
  ###############################################################################
  # 200 should not be possible since Vault is not initialized yet but we allow it here defensively as well
  # 429 (sealed) or 501 (uninitialized) are expected
- hosts: bastion_primary
  become: false
  gather_facts: false
  vars_files:
    - ../vars/bootstrap-tls-vault-consul.yaml
  tasks:      
  # verify mTLS from Bastion to Vault
  - name: Verify Vault HTTPS API from Bastion
    uri:
      url: "{{ vault_api_health_addr }}"
      method: GET
      client_cert: "{{ bastion_client_auth_to_vault_cert_path }}"
      client_key: "{{ bastion_client_auth_to_vault_key_path }}"
      validate_certs: true
      status_code: [ 429, 501, 503 ]
    register: vault_https_bastion_health
    changed_when: false

  - name: Fail when Bastion sees Vault sealed after TLS reconfigure
    fail:
      msg: >-
        Bastion can reach Vault over mTLS, but Vault is sealed after restart (health status 503).
        Run playbooks/62-vault-unseal-preflight-check.yaml and then
        playbooks/63-vault-unseal.yaml.
    when: vault_https_bastion_health.status == 503
