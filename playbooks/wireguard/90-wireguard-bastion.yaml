---
- name: Install and configure WireGuard on bastion
  hosts: bastion_primary
  become: true
  gather_facts: false

  vars_files:
    - ../../vars/wireguard-bastion.yaml

  tasks:
    - name: Validate WireGuard server settings
      assert:
        that:
          - wireguard_interface | length > 0
          - wireguard_server_ip is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
          - wireguard_server_cidr is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$')
          - wireguard_network_cidr is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$')
        fail_msg: Update vars/wireguard-bastion.yaml with a valid WireGuard interface and VPN subnet before running this playbook.

    - name: Ensure WireGuard packages are installed
      apt:
        name:
          - wireguard
          - wireguard-tools
        state: present
        update_cache: true

    - name: Ensure /etc/wireguard exists
      file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check WireGuard private key
      stat:
        path: "{{ wireguard_private_key_path }}"
      register: wireguard_private_key_stat

    - name: Generate WireGuard private key
      shell: "wg genkey > {{ wireguard_private_key_path }}"
      args:
        creates: "{{ wireguard_private_key_path }}"
      when: not wireguard_private_key_stat.stat.exists
      no_log: true

    - name: Set permissions on WireGuard private key
      file:
        path: "{{ wireguard_private_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Check WireGuard public key
      stat:
        path: "{{ wireguard_public_key_path }}"
      register: wireguard_public_key_stat

    - name: Generate WireGuard public key
      shell: "wg pubkey < {{ wireguard_private_key_path }} > {{ wireguard_public_key_path }}"
      args:
        creates: "{{ wireguard_public_key_path }}"
      when: not wireguard_public_key_stat.stat.exists
      no_log: true

    - name: Set permissions on WireGuard public key
      file:
        path: "{{ wireguard_public_key_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Read WireGuard private key
      slurp:
        path: "{{ wireguard_private_key_path }}"
      register: wireguard_private_key_raw
      no_log: true

    - name: Read WireGuard public key
      slurp:
        path: "{{ wireguard_public_key_path }}"
      register: wireguard_public_key_raw

    - name: Set WireGuard key facts
      set_fact:
        wireguard_private_key: "{{ wireguard_private_key_raw.content | b64decode | trim }}"
        wireguard_public_key: "{{ wireguard_public_key_raw.content | b64decode | trim }}"
      no_log: true

    - name: Render WireGuard interface configuration
      template:
        src: templates/wireguard.conf.j2
        dest: "{{ wireguard_config_path }}"
        owner: root
        group: root
        mode: "0600"
      register: wireguard_config

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Enable and restart WireGuard interface
      systemd:
        name: "wg-quick@{{ wireguard_interface }}"
        enabled: true
        state: "{{ 'restarted' if wireguard_config.changed else 'started' }}"

    - name: Show bastion WireGuard public key
      debug:
        msg: "Bastion WireGuard public key: {{ wireguard_public_key }}"
