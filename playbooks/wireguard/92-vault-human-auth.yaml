---
- name: Configure Vault human OIDC auth
  hosts: "{{ groups['vault'][0] }}"
  become: true

  vars:
    vault_cli_env:
      VAULT_ADDR: "{{ vault_api_addr }}"
      VAULT_CLIENT_CERT: "{{ vault_server_cert_path }}"
      VAULT_CLIENT_KEY: "{{ vault_server_key_path }}"
      VAULT_CACERT: "{{ vault_ca_cert_path }}"
    vault_cli_auth_env: "{{ vault_cli_env | combine({'VAULT_TOKEN': vault_root_token}) }}"

  vars_files:
    - ../../vars/vault-init-unseal-config.yaml
    - ../../vars/bootstrap-tls-vault-consul.yaml
    - ../../vars/vault-config-ssh.yaml
    - ../../vars/vault-human-auth.yaml

  environment: "{{ vault_cli_env }}"

  tasks:
    - name: Load Vault init data and root token
      import_tasks: ../../tasks/vault/read-init-token.yaml

    - name: Check Vault is initialized and unsealed
      import_tasks: ../../tasks/vault/assert-initialized-unsealed.yaml

    - name: Validate OIDC provider settings
      assert:
        that:
          - vault_human_auth_mount_path | length > 0
          - vault_human_oidc_role_name | length > 0
          - vault_human_oidc_discovery_url | length > 0
          - vault_human_oidc_client_id | length > 0
          - vault_human_oidc_client_secret | length > 0
          - vault_human_oidc_allowed_redirect_uris | length > 0
        fail_msg: Update vars/vault-human-auth.yaml with your OIDC provider details before running this playbook.

    - name: Check enabled Vault auth methods
      command:
        argv:
          - vault
          - auth
          - list
          - -format=json
          - -address={{ vault_api_addr }}
      register: vault_auth_methods_raw
      changed_when: false
      environment: "{{ vault_cli_auth_env }}"
      no_log: true

    - name: Parse enabled Vault auth methods
      set_fact:
        vault_auth_methods: "{{ vault_auth_methods_raw.stdout | from_json }}"
      no_log: true

    - name: Enable Vault human OIDC auth method
      command:
        argv:
          - vault
          - auth
          - enable
          - -path={{ vault_human_auth_mount_path }}
          - -address={{ vault_api_addr }}
          - oidc
      when: (vault_human_auth_mount_path ~ '/') not in vault_auth_methods
      environment: "{{ vault_cli_auth_env }}"
      changed_when: true
      no_log: true

    - name: Create temporary file for Vault human OIDC config payload
      tempfile:
        state: file
        suffix: .json
      register: vault_human_oidc_config_payload_file

    - name: Write Vault human OIDC config payload
      copy:
        dest: "{{ vault_human_oidc_config_payload_file.path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          {{ {
            'oidc_discovery_url': vault_human_oidc_discovery_url,
            'oidc_client_id': vault_human_oidc_client_id,
            'oidc_client_secret': vault_human_oidc_client_secret,
            'default_role': vault_human_oidc_role_name
          } | to_nice_json }}
      no_log: true

    - name: Configure Vault human OIDC auth backend
      command:
        argv:
          - vault
          - write
          - -address={{ vault_api_addr }}
          - auth/{{ vault_human_auth_mount_path }}/config
          - "@{{ vault_human_oidc_config_payload_file.path }}"
      environment: "{{ vault_cli_auth_env }}"
      changed_when: true
      no_log: true

    - name: Remove temporary Vault human OIDC config payload
      file:
        path: "{{ vault_human_oidc_config_payload_file.path }}"
        state: absent
