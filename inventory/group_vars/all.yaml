# For THIS host/group, SSH as ansible user by default;
ansible_user: ansible
# become: false is default Ansible behaviour


# DNS
dns_entries:
  # later for HA should be changed to load balancer in front of Vault nodes
  vault:
    host: "{{ groups['vault'][0] }}"
    names:
    - "{{ vault_service_name }}"
    - "{{ groups['vault'][0] }}"

  consul:
    # for Consul it doesn't matter which node we point to since they replicate data among themselves
    host: "{{ groups['consul_servers'][0] }}"
    names:
    - "{{ consul_service_name }}"
    - "{{ groups['consul_servers'][0] }}"
    


######################################################
######### Consul  ####################################
######################################################
# TLS lifecycle flag (flipped by bootstrap-tls playbook via set_fact)
consul_tls_enabled: false

# HTTP or HTTPS depending on TLS phase
consul_agent_api_scheme: "{{ 'https' if consul_tls_enabled else 'http' }}"

# internally used addresses
# will work with gather_facts: false as well, 
# since the value is derived from inventory variables 
# with a fallback to inventory_hostname
internal_address: "{{ ansible_host | default(inventory_hostname) }}"

# local interface the Consul agent binds to
# affects listeners and gossip
# never used by other services directly
consul_internal_bind_addr: "{{ internal_address }}"

# Consul internal – cluster identity
# used only for Consul ↔ Consul communication
consul_internal_advertise_addr: "{{ internal_address }}"

consul_service_name: "consul.service.internal"

# Port of the Consul agent API (8501 = HTTPS, 8500 = HTTP)
consul_http_port: 8500
consul_https_port: 8501
consul_dns_port: 8600
consul_agent_api_port: "{{ consul_https_port if consul_tls_enabled else consul_http_port }}"


# Address advertised by the Consul agent for client access; HTTP/HTTPS API
# used by Vault, Bastion, kubectl plugins, etc.
consul_api_addr: "{{ consul_agent_api_scheme }}://{{ consul_service_name }}:{{ consul_agent_api_port }}"
consul_api_leader_addr: "{{ consul_api_addr }}/v1/agent/self"
consul_api_health_addr: "{{ consul_api_addr }}/v1/status/leader"


######################################################
######### Vault  #####################################
######################################################

# TLS lifecycle flag (flipped by bootstrap-tls playbook via set_fact)
vault_tls_enabled: false

# HTTP or HTTPS depending on TLS phase
vault_api_scheme: "{{ 'https' if vault_tls_enabled else 'http' }}"

vault_service_name: "vault.service.internal"

vault_api_port: 8200
vault_cluster_port: 8201

vault_api_health_path: /v1/sys/health

# internally used addresses
# will work with gather_facts: false as well, 
# since the value is derived from inventory variables 
# with a fallback to inventory_hostname
vault_internal_address: "{{ ansible_host | default(inventory_hostname) }}"
vault_api_addr: "{{ vault_api_scheme }}://{{ vault_service_name }}:{{ vault_api_port }}"
vault_cluster_addr: "{{ vault_api_scheme }}://{{ vault_internal_address }}:{{ vault_cluster_port}}"

######################################################
######### Consul-Vault  ##############################
######################################################

#key prefix inside Consul’s KV store where Vault data will be stored
vault_prefix_in_consul_store: "vault/"


